recipe:
  name: aya-fire-multilingual-safety-repair
  description: "Circuit-restricted weight arithmetic (C-\u0394\u0398) repair on Cohere2\
    \ backbone"
  model: CohereLabs/tiny-aya-fire
  dataset: /home/me/Videos/lexsihack/experiments/experiment_02_aya_fire_lexsistack/data/data.csv
  task: multilingual_safety_repair
  algorithm: circuit_restricted_weight_arithmetic
  backend: circuitkit+safetune
  tags:
  - lexsi-stack
  - aya-fire
  - c-delta-theta
  - multilingual
  - cybersecurity
  requires_auth: false
  estimated_time: 5 minutes (offline arithmetic)
  estimated_memory: 14 GB GPU / 16 GB CPU
