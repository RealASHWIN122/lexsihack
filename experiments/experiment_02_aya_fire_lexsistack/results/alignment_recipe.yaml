    loss_type: nll
    activation_offloading: false
    use_flash_attention_2: null
    enable_thinking: false
    gradient_checkpointing: false
    gradient_checkpointing_kwargs: {}
    extra_params: {}
    torch_compile: false
    use_liger_kernel: false
    fp8_adamw: false
    seed: 42
    data_seed: null
    accelerate_config_path: null
  logging:
    output_dir: ./output/llama3-sft
    run_name: llama3-instruction-tuning
    loggers:
    - tensorboard
    log_level: INFO
    log_interval: 10
    save_strategy: steps
    eval_strategy: steps
    report_to: none
  evaluation:
    compute_perplexity: true
    compute_rouge: true
    compute_bleu: true
    compute_meteor: false
    compute_bertscore: false
    compute_semantic_similarity: false
    compute_codebleu: false
    custom_metrics: null
    max_samples_for_quality_metrics: 50
    bertscore_model: microsoft/deberta-xlarge-mnli
    semantic_similarity_model: sentence-transformers/all-MiniLM-L6-v2
