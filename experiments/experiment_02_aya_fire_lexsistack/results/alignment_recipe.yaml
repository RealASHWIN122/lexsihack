    name_or_path: meta-llama/Meta-Llama-3-8B-Instruct
    tokenizer_name_or_path: null
    precision: bf16
    quantization: {}
    attn_implementation: auto
    sliding_window: null
    s2_group_size_ratio: 0.25
    s2_min_seq_length: 64
    s2_shift_ratio: 0.5
    gradient_checkpointing: true
    max_memory: null
    use_unsloth: true
    max_seq_length: 4096
    use_gradient_checkpointing: true
    peft: !!python/object:aligntune.core.sft.config.PeftConfigData
      enabled: true
      variant: standard
      rank: 16
      alpha: 32
      dropout: 0.05
      target_modules: null
      bias: none
      dora_enabled: false
      rslora_enabled: false
      loftq_init: false
      pissa_init: false
      rslora: false
      init_weights: true
      loraplus_lr_ratio: null
      loraplus_lr_embedding: null
    rope: !!python/object:aligntune.core.long_context.rope_config.RopeConfig
      rope_type: null
      target_max_seq_length: null
      factor: null
      rope_theta: null
      original_max_position_embeddings: null
      partial_rotary_factor: null
      attention_factor: null
      beta_fast: null
      beta_slow: null
      short_factor: null
      long_factor: null
      low_freq_factor: null
      high_freq_factor: null
    num_labels: null
    model_init_kwargs: {}
    device_map: auto
    trust_remote_code: true
    embedding_pad_to_multiple_of: null
    train_embeddings: false
    embedding_init_method: random
    is_vlm: false
    vision_tower_mode: freeze
    image_column: image
    max_image_tokens: 4096
    peft_enabled: true
    lora_rank: 16
    dora_enabled: false
    rslora_enabled: false
    loftq_init: false
    pissa_init: false
    use_liger_kernel: false
  dataset:
    name: mlabonne/FineTome-100k
    train_split: train
    test_split: null
    split: train
    config_name: null
    subset: null
    config: null
    percent: null
    max_samples: null
    column_mapping: {}
    task_type: sft
    system_prompt: null
    auto_detect_fields: false
    format_type: null
    text_column: text
    instruction_column: instruction
    response_column: response
    output_column: output
    input_column: input
    context_column: context
    label_column: label
    tokens_column: tokens
    tags_column: ner_tags
    messages_column: messages
    dataset_text_field: text
    image_column: image
    chat_template: llama3
    dataset_num_proc: null
    pad_token: null
    preserve_columns: null
    keep_columns: null
    processing_fn: null
