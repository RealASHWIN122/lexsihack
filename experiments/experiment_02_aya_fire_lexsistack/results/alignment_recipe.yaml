    processing_fn_kwargs: {}
    val_split_ratio: null
    test_split_ratio: null
    split_seed: 42
    curator_schema_gate: true
    curator_clean: false
    curator_dedup: none
    curator_use_tiktoken: false
    curator_max_tokens: 1000000
  eval_dataset: null
  train:
    per_device_batch_size: 2
    per_device_eval_batch_size: null
    gradient_accumulation_steps: 4
    max_steps: null
    epochs: 1
    learning_rate: 0.0002
    weight_decay: 0.01
    warmup_steps: 10
    warmup_ratio: 0.1
    eval_interval: 100
    save_interval: 500
    max_grad_norm: 0.3
    fp16: false
    bf16: false
    dataloader_num_workers: 0
    remove_unused_columns: false
